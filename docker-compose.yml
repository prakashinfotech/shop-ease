services:

  # ==========================================
  # SQL Server
  # ==========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopease-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    volumes:
      - sqlserver_data:/var/opt/mssql

    networks:
      - shopease-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  # ==========================================
  # Backend
  # ==========================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: shopease-backend

    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"

      ConnectionStrings__DefaultConnection: >-
        Server=sqlserver,1433;
        Database=${DB_NAME};
        User Id=${DB_USER};
        Password=${DB_PASSWORD};
        TrustServerCertificate=True;

      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"
      JwtSettings__ExpiryMinutes: "${JWT_EXPIRY_MINUTES}"
      JwtSettings__RefreshExpiryDays: "${JWT_REFRESH_EXPIRY_DAYS}"

      CorsSettings__AllowedOrigins: "${FRONTEND_URL}"

    ports:
      - "127.0.0.1:5001:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - shopease-network

    restart: unless-stopped


  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: "${BACKEND_URL}"

    container_name: shopease-frontend

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - backend

    networks:
      - shopease-network

    restart: unless-stopped


# ==========================================
# Volumes
# ==========================================
volumes:
  sqlserver_data:


# ==========================================
# Network
# ==========================================
networks:
  shopease-network:
    driver: bridge
